name: Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply HarfBuzz runtime workaround
        shell: pwsh
        run: |
          $path = "node_modules/harfbuzzjs/dist/index.mjs"
          $content = Get-Content $path -Raw
          $content = $content.Replace("init(await createHarfBuzz({ locateFile: () => '/harfbuzz.wasm' }));", "init(await createHarfBuzz());")
          Set-Content -Path $path -Value $content -NoNewline

      - name: Download Windows FFmpeg binary
        run: npm rebuild ffmpeg-static --foreground-scripts

      - name: Install native Electron dependencies
        run: npx electron-builder install-app-deps

      - name: Build Windows installer
        run: npm run build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: arabic-stroke-windows
          path: dist/*.exe
          if-no-files-found: error
